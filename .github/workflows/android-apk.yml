name: Construire l'APK Android

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Construire le site (dist)
        run: npm run build

      - name: Injecter le secret d'activation
        env:
          ACTIVATION_SECRET: ${{ secrets.ACTIVATION_SECRET }}
        run: node scripts/inject-secret.js

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configurer la signature fixe
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/fixe.keystore
          cat scripts/signing.gradle >> android/app/build.gradle

      - name: Compiler l'APK
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: diallo3ops-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK dans une Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk diallo3ops-${{ github.run_number }}.apk
          gh release create "v${{ github.run_number }}" "diallo3ops-${{ github.run_number }}.apk" \
            --title "APK DIALLO 3 OPERATEURS v${{ github.run_number }}" \
            --notes "Télécharger le fichier .apk et l'installer sur le téléphone." \
            --repo "${{ github.repository }}"
